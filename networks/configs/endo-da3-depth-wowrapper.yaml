__object__:
  path: networks
  name: EndoDepthAnything3Net
  args: as_params

lora_type: "lora"
# lora_type: "dvlora"
# lora_type: "none"
lora_r: 4

dino_resize_hw:
  - 224
  - 280
ref_view_strategy: "first"
# ref_view_strategy: "saddle_balanced"

net:
  __object__:
    path: networks
    name: EndoDinoVisionTransformer
    args: as_params
  
  # vit-Base setting up
  ffn_layer: "mlp"
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  num_register_tokens: 0

  alt_start: 4
  qknorm_start: 4
  rope_start: 4
  cat_token: True
  # cat_token: False # dim_in for head should be set to 768
  # used for extract DPT input for depth estimation
  out_layers: [5, 7, 9, 11] # default in DA3
  # out_layers: [8, 9, 10, 11] # endoDAC style

  residual_block_indexes: []

  # dino_resize_hw: actual input image size after resizing (used for residual block patch dimensions)
  # If not specified, falls back to img_size
  dino_resize_hw: [224, 280]

# head:
#   __object__:
#     path: depth_anything_3.model.dualdpt
#     name: DualDPT
#     args: as_params

#   dim_in: &head_dim_in 1536
#   output_dim: 2
#   features: &head_features 128
#   out_channels: &head_out_channels [96, 192, 384, 768]

# dpt head: the output shape from the head differs from DualDPT Head: (B, S, H, W, 1) instead of (B, S, H, W)
head:
  __object__:
    path: depth_anything_3.model.dpt #depth_anything_3.model.dualdpt
    name: DPT #DualDPT
    args: as_params

  # below param setting enables loading depth_dpt from pretrained dualDPT
  dim_in: &head_dim_in 1536
  output_dim: 2
  norm_type: "layer"
  pos_embed: True

  # below param enable train naive depth-only DPT from scratch
  # dim_in: &head_dim_in 768 # as cat_token is False
  # norm_type: "idt"
  # pos_embed: False

  features: &head_features 128
  out_channels: &head_out_channels [96, 192, 384, 768]
  use_sky_head: False

