__object__:
  # path: depth_anything_3.model.da3
  # name: DepthAnything3Net
  path: networks
  name: EndoDepthAnything3Net
  args: as_params

dino_resize_hw:
  - 224
  - 280

# ref_view_strategy: "saddle_balanced"
ref_view_strategy: "first"

# use the original DinoV2 wrapper
net:
  __object__:
    path: depth_anything_3.model.dinov2.dinov2
    name: DinoV2
    args: as_params

  name: vitb
  out_layers: [5, 7, 9, 11]
  alt_start: 4
  qknorm_start: 4
  rope_start: 4
  cat_token: True

head:
  __object__:
    # path: depth_anything_3.model.dpt #depth_anything_3.model.dualdpt
    # name: DPT #DualDPT
    path: depth_anything_3.model.dualdpt
    name: DualDPT
    args: as_params

  dim_in: &head_dim_in 1536
  output_dim: 2
  features: &head_features 128
  out_channels: &head_out_channels [96, 192, 384, 768]


